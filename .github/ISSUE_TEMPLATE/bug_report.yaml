name: Bug report
description: 报告 NIKINIKI 在 Symbian³ / Nokia Belle 上的问题
labels: ["bug"]
body:
  - type: input
    validations:
      required: true
    attributes:
      label: 手机型号
      description: 例如 Nokia 603、701、808
  - type: input
    validations:
      required: true
    attributes:
      label: 系统与固件版本
      description: 例如 Symbian Belle 113.010.1506
  - type: input
    validations:
      required: true
    attributes:
      label: NIKINIKI 版本
      description: 请注明 Debug/Release，以及安装包来源或 SHA-256
  - type: textarea
    validations:
      required: true
    attributes:
      label: 问题与复现步骤
      description: 请从冷启动开始列出最短复现步骤、预期结果和实际结果
  - type: input
    attributes:
      label: 视频或直播标识
      description: 播放问题请提供 BVID、EPID 或直播间号；不要粘贴带 Cookie 的媒体 URL
  - type: textarea
    attributes:
      label: 日志与截图
      description: "可附 WW: 日志、截图或录屏；请先删除 Cookie、账号信息、私网地址和设备标识"
  - type: checkboxes
    attributes:
      label: 提交确认
      options:
        - label: 我已阅读仓库 README 中的当前状态与已知限制
          required: true
        - label: 我已搜索现有 issue，未发现相同问题
          required: true
        - label: 附件中不含 Cookie、证书、私钥、私网地址或其他个人信息
          required: true
